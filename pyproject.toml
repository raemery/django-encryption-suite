[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-encryption-suite"
dynamic = ["version"]
description ="Encrypted Django model fields with envelope encryption, pluggable KMS backends, and multi-tenancy silo adapters"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [
    { name = "J. Randall Emery" },
]
keywords = [
    "django",
    "encrypted fields",
    "kms",
    "tink",
    "multi-tenant",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "Django>=5.2",
    # Default crypto backend (pyca-cryptography). cryptography is ubiquitous,
    # has no protobuf dependency, and is often already present in a Django stack.
    # >= 42 for AES-GCM-SIV. Tink is opt-in via the [tink] extra.
    "cryptography>=42",
]

[project.urls]
Homepage = "https://github.com/raemery/django-encryption-suite"
Repository = "https://github.com/raemery/django-encryption-suite"
Issues = "https://github.com/raemery/django-encryption-suite/issues"

[project.optional-dependencies]
# The Tink crypto backend and the Tink-based KMS adapters. Opt-in: Tink is not a
# core dependency (the default backend is pyca-cryptography). Pulls in
# protobuf/absl via tink.
tink = ["tink>=1.10.0"]
# Native GcpKmsAdapter + provisioner talk to Cloud KMS over raw REST, so
# google-auth alone is enough. GcpTinkKmsAdapter additionally needs Tink and
# google-cloud-kms (pulled in by tink.integration.gcpkms) — use the gcp-tink extra.
gcp = ["google-auth>=2.0"]
gcp-tink = ["django-encryption-suite[gcp,tink]", "google-cloud-kms>=2.0"]
aws = ["boto3>=1.26"]
aws-tink = ["django-encryption-suite[aws,tink]"]
azure = [
    "azure-identity>=1.12",
    "azure-keyvault-keys>=4.8",
]
hashicorp = []
# Only the compute-native "container" / "vpc_instance" trusted-profile strategies
# need this. The "api_key" and "iam_assume" strategies are built in (no extra).
ibm = ["ibm-cloud-sdk-core>=3.20"]
oci = ["oci>=2.0"]
infisical = []
# Note: the pyca-cryptography crypto backend needs no extra — `cryptography` is a
# core dependency (it is the default backend).
# Optional DRF integration: encryption_suite.contrib.drf (exception handler +
# serializer mixin for surfacing error-code slugs / undecryptable reads in APIs).
drf = ["djangorestframework>=3.14"]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "factory-boy>=3.3",
    "djangorestframework>=3.14",
    "tink>=1.10.0",
]

[tool.hatch.version]
path = "src/encryption_suite/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/encryption_suite"]
artifacts = [
    "src/encryption_suite/locale/**/*.mo",
]

[tool.hatch.build.targets.sdist]
exclude = [
    ".claude",
]
artifacts = [
    "src/encryption_suite/locale/**/*.mo",
]

[tool.ruff]
# Migrations are generated by makemigrations, which writes one long line per
# field; hand-wrapping them is undone the next time they are regenerated.
extend-exclude = ["migrations"]
line-length = 120
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# gettext_lazy returns a lazy proxy, so calling it in argument defaults is the
# intended Django idiom, not the B008 mutable-default hazard. Treat it as immutable.
extend-immutable-calls = ["django.utils.translation.gettext_lazy"]

[tool.ruff.format]
quote-style = "double"
